# Default values for pro
# Two replicas keep the server answering while one pod is evicted (a node
# drain, a spot interruption). MCP sessions live in the pod that created
# them, so the Service pins each client to one pod (service.sessionAffinity).
replicaCount: 2

image:
  repository: gsoci.azurecr.io/giantswarm/pro
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  # ClientIP keeps a client's MCP session on the pod that holds it; after that
  # pod goes away the client gets 404 for the session and initializes anew.
  sessionAffinity: ClientIP

# A voluntary disruption (a drain) never takes the last ready pod.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spread the replicas over nodes and zones, so one lost node leaves one up.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

route:
  enabled: false
  hostnames: []
  # - pro.example.gigantic.io

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Container env vars. The schema annotation below declares the allowed
# shape (both `value:` and `valueFrom:` are permitted) so HelmReleases that
# pass plain string env vars validate against the schema.
# Generator infers items from the default below; itemProperties overrides it.
# @schema itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, properties: {secretKeyRef: {type: object, properties: {key: {type: string}, name: {type: string}}}}}}
env:
  - name: GITHUB_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: pro-github-token
        key: token

nodeSelector: {}
tolerations: []
affinity: {}
