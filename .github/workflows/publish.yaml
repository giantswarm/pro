---
# yamllint disable rule:truthy
# Publishes the npm package for every release tag:
#
#   1. sets the package version from the release tag (package.json stays at
#      0.0.0 in git; the tag is the single source of truth for versions)
#   2. attaches the npm tarball to the GitHub Release (used by `pro
#      --self-update` and installable directly via `npm install -g <url>`)
#   3. publishes @giantswarm-io/pro to the npm registry, a release candidate
#      under the `next` dist-tag, as an npm trusted publisher: npm trusts this
#      workflow of giantswarm/pro through its GitHub OIDC token, so no npm
#      token is stored (configured in the package's settings on npmjs.com)
#
# Trigger notes: releases are created by the Auto-release workflow
# (zz_generated.auto_release.yaml) using GITHUB_TOKEN, and GitHub suppresses
# `release`/tag-`push` triggers for events created with that token. So this
# workflow triggers on Auto-release *completing* and resolves the tag from
# the run's head SHA. `release` covers human-created releases and
# `workflow_dispatch` allows manual (re)publishing of any existing tag.
name: Publish package

on:
  workflow_run:
    workflows:
      - Auto-release
    types:
      - completed
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write   # upload the tarball to the release
  id-token: write   # npm trusted publishing and provenance (OIDC)

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release)
              TAG="$RELEASE_TAG"
              ;;
            workflow_dispatch)
              TAG="$DISPATCH_TAG"
              ;;
            workflow_run)
              # Auto-release tags the pushed commit if a bump was warranted.
              # No tag on the run's head SHA means no release happened.
              TAG=$(git tag --points-at "$RUN_HEAD_SHA" --list 'v*.*.*' | head -n1)
              if [ -z "$TAG" ]; then
                echo "::notice::No release tag on ${RUN_HEAD_SHA}; Auto-release made no release. Nothing to publish."
              fi
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git checkout "refs/tags/$TAG"

      - name: Set up Node.js
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Node 24 brings npm 11.19, enough for trusted publishing (11.5.1+);
      # npm 11.21 is what `npm dist-tag` under it needs, in case `--tag next`
      # turns out to count as one. Installed before `npm ci` so the tarball is
      # packed and published by the same npm. 11.21.0 is older than the 14
      # days the Renovate presets wait for an npm release.
      - name: Install npm for trusted publishing
        if: steps.tag.outputs.tag != ''
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        if: steps.tag.outputs.tag != ''
        run: npm ci

      - name: Run tests
        if: steps.tag.outputs.tag != ''
        env:
          GITHUB_API_TOKEN: dummy-for-ci-validation
        run: npm test

      - name: Set version from release tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: npm version --no-git-tag-version "${TAG#v}"

      - name: Pack tarball
        if: steps.tag.outputs.tag != ''
        id: pack
        run: echo "tarball=$(npm pack)" >> "$GITHUB_OUTPUT"

      - name: Attach tarball to release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release upload "$TAG" "$TARBALL" --clobber

      # Authenticates as an npm trusted publisher (GitHub OIDC). A 404 or 401
      # here means the package's trusted publisher on npmjs.com no longer
      # matches: org giantswarm, repo pro, workflow publish.yaml.
      #
      # npm refuses a prerelease version (v1.14.0-rc.1) without a dist-tag.
      # Release candidates go to `next`, so `latest` stays on the last
      # stable release.
      - name: Publish to npm
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A semver prerelease has a "-" before any "+build" metadata.
          VERSION="${TAG#v}"
          DIST_TAG=latest
          case "${VERSION%%+*}" in
            *-*) DIST_TAG=next ;;
          esac
          npm publish --access public --provenance --tag "$DIST_TAG"
